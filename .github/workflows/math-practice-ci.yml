name: Math Practice CI

# Checks the Math Practice app whenever it changes: lint, formatting, every
# test, and the production build. It only checks; it does not deploy anything.
on:
  push:
    paths:
      - 'Assignment 13/math-practice-app/**'
      - '.github/workflows/math-practice-ci.yml'
  pull_request:
    paths:
      - 'Assignment 13/math-practice-app/**'
      - '.github/workflows/math-practice-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Assignment 13/math-practice-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Assignment 13/math-practice-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint, format check, tests and production build
        run: npm run verify
