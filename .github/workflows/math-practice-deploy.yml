name: Deploy Math Practice to GitHub Pages

# Publishes the app at https://<owner>.github.io/<repository>/ after the tests
# pass. One-time setup: in the repository, Settings > Pages > Build and
# deployment > Source, choose "GitHub Actions". Until then the deploy step
# reports that Pages is not enabled; run this workflow again afterwards.
on:
  push:
    branches: [main]
    paths:
      - 'Assignment 13/math-practice-app/**'
      - '.github/workflows/math-practice-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Assignment 13/math-practice-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Assignment 13/math-practice-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # The site lives under /<repository>/, and Pages cannot send security
      # headers, so the same policy is written into the page (see vite.config.ts).
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_META_CSP: '1'

      # Pages shows 404.html for an address it does not know. Making that the app
      # means a refresh or a shared link such as /statistics still works.
      - name: Make every address open the app
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Assignment 13/math-practice-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
