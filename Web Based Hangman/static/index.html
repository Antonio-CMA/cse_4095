<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hangman</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app">
    <h1>Hangman</h1>

    <div class="controls">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="new-game" type="button" class="primary">New Game</button>
    </div>

    <div class="board">
      <!-- The gallows is always visible; each wrong guess reveals one body part. -->
      <svg id="drawing" viewBox="0 0 200 240" role="img" aria-label="Hangman drawing">
        <g class="gallows">
          <line x1="20" y1="225" x2="130" y2="225" />
          <line x1="50" y1="225" x2="50" y2="20" />
          <line x1="50" y1="20" x2="140" y2="20" />
          <line x1="140" y1="20" x2="140" y2="45" />
        </g>
        <g class="body">
          <circle id="part-1" class="part" cx="140" cy="62" r="17" />
          <line id="part-2" class="part" x1="140" y1="79" x2="140" y2="140" />
          <line id="part-3" class="part" x1="140" y1="95" x2="112" y2="122" />
          <line id="part-4" class="part" x1="140" y1="95" x2="168" y2="122" />
          <line id="part-5" class="part" x1="140" y1="140" x2="115" y2="180" />
          <line id="part-6" class="part" x1="140" y1="140" x2="165" y2="180" />
        </g>
      </svg>

      <div class="info">
        <div id="word" class="word" aria-label="Word to guess"></div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <dl class="stats">
          <div><dt>Guesses left</dt><dd id="remaining">-</dd></div>
          <div><dt>Wrong letters</dt><dd id="incorrect">-</dd></div>
          <div><dt>Guessed letters</dt><dd id="guessed">-</dd></div>
        </dl>
      </div>
    </div>

    <div id="keyboard" class="keyboard" aria-label="Letter keyboard"></div>
    <p class="hint">Click a letter or type on your keyboard.</p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
